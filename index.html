<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 우리 언제 만날까?</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root {
    --bg: oklch(0.98 0.005 80);
    --surface: oklch(1 0 0);
    --surface-alt: oklch(0.96 0.008 80);
    --text-primary: oklch(0.22 0.02 60);
    --text-secondary: oklch(0.50 0.02 60);
    --text-muted: oklch(0.65 0.015 60);
    --accent: oklch(0.62 0.18 145);
    --accent-light: oklch(0.92 0.06 145);
    --accent-dark: oklch(0.48 0.14 145);
    --coral: oklch(0.65 0.18 25);
    --sunday: oklch(0.60 0.18 25);
    --border: oklch(0.90 0.01 80);
    --shadow-sm: 0 1px 3px oklch(0.22 0.02 60 / 0.06);
    --shadow-md: 0 4px 16px oklch(0.22 0.02 60 / 0.08);
    --shadow-lg: 0 8px 32px oklch(0.22 0.02 60 / 0.12);
    --radius: 14px;
    --radius-sm: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg); color: var(--text-primary);
    min-height: 100vh; padding: 24px 16px 80px;
  }
  .container { max-width: 680px; margin: 0 auto; }

  .header { text-align: center; padding: 36px 0 28px; }
  .header h1 {
    font-family: 'Outfit', 'Noto Sans KR', sans-serif;
    font-size: clamp(28px, 6vw, 42px); font-weight: 800;
    letter-spacing: -0.5px; line-height: 1.2; margin-bottom: 8px;
  }
  .header p { font-size: 17px; color: var(--text-secondary); line-height: 1.6; }
  .header .subtitle-emoji { font-size: 32px; display: block; margin-bottom: 12px; }

  .sync-bar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 16px; margin-bottom: 24px;
    background: var(--accent-light); border-radius: var(--radius-sm);
    font-size: 14px; color: var(--accent-dark); font-weight: 500;
  }
  .sync-bar .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

  .person-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin: 20px 0; }
  .person-btn {
    padding: 16px 12px; border-radius: var(--radius); border: 2px solid var(--border);
    background: var(--surface); cursor: pointer; text-align: center;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .person-btn:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .person-btn .avatar {
    width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: white;
  }
  .person-btn .name { font-size: 16px; font-weight: 600; }
  .person-btn .check-count { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .person-btn.has-data .check-count { color: var(--accent); font-weight: 500; }

  .calendar-section { display: none; }
  .calendar-section.visible { display: block; }
  .current-person-bar {
    display: flex; align-items: center; gap: 12px; padding: 16px 20px;
    background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); margin-bottom: 24px;
  }
  .current-person-bar .avatar-sm {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: white;
  }
  .current-person-bar .info { flex: 1; }
  .current-person-bar .info .name { font-weight: 700; font-size: 18px; }
  .current-person-bar .info .hint { font-size: 14px; color: var(--text-muted); }
  .back-btn {
    padding: 8px 16px; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
    background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text-secondary); transition: all 0.2s ease;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .back-btn:hover { border-color: var(--text-secondary); color: var(--text-primary); }

  .month-block {
    margin-bottom: 28px; background: var(--surface);
    border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-sm);
  }
  .month-title {
    font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 800;
    color: var(--text-primary); margin-bottom: 18px; text-align: center;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-header { text-align: center; font-size: 13px; font-weight: 700; color: var(--text-muted); padding: 8px 0; }
  .cal-header.sun { color: var(--sunday); }
  .cal-header.sat { color: var(--accent); }
  .cal-cell {
    aspect-ratio: 1; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600;
    color: var(--text-muted); position: relative;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    user-select: none; -webkit-user-select: none;
  }
  .cal-cell.empty { visibility: hidden; }
  .cal-cell.sun { color: oklch(0.72 0.12 25); }
  .cal-cell.weekday { color: oklch(0.78 0.01 60); }
  .cal-cell.saturday {
    color: var(--accent-dark); font-weight: 800; font-size: 20px;
    cursor: pointer; border: 2.5px solid var(--border); background: var(--surface-alt);
  }
  .cal-cell.saturday:hover {
    border-color: var(--accent); background: oklch(0.96 0.03 145);
    transform: scale(1.08); box-shadow: var(--shadow-md);
  }
  .cal-cell.saturday.checked {
    background: var(--accent); color: white; border-color: var(--accent);
    transform: scale(1.05); box-shadow: 0 4px 12px oklch(0.62 0.18 145 / 0.3);
  }
  .cal-cell.saturday.checked:hover {
    background: var(--accent-dark); border-color: var(--accent-dark); transform: scale(1.1);
  }
  .cal-cell.today::after {
    content: ''; position: absolute; bottom: 6px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--coral);
  }
  .cal-cell.saturday.today::after { background: white; }

  .save-bar { display: flex; gap: 12px; margin-top: 24px; }
  .save-btn {
    flex: 1; padding: 16px; border-radius: var(--radius); border: none;
    font-size: 17px; font-weight: 700; cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--accent); color: white;
  }
  .save-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .save-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .results-section { display: none; }
  .results-section.visible { display: block; }
  .result-card {
    padding: 20px; border-radius: var(--radius); background: var(--surface);
    margin-bottom: 12px; border: 2px solid var(--border);
  }
  .result-card.best { border-color: var(--accent); background: var(--accent-light); position: relative; }
  .result-card.best::before {
    content: '🎉 BEST'; position: absolute; top: -12px; right: 16px;
    background: var(--accent); color: white; font-size: 12px; font-weight: 800;
    font-family: 'Outfit', sans-serif; padding: 3px 10px; border-radius: 20px;
  }
  .result-card .result-date { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 800; margin-bottom: 10px; }
  .result-card .result-people { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .result-card .person-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: 500;
  }
  .result-card .person-chip.available { background: var(--accent-light); color: var(--accent-dark); }
  .result-card .person-chip.unavailable { background: var(--surface-alt); color: var(--text-muted); text-decoration: line-through; opacity: 0.6; }
  .result-bar-track { height: 8px; background: var(--surface-alt); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .result-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
  .result-count { font-size: 14px; color: var(--text-secondary); font-weight: 600; margin-top: 8px; }

  .view-tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-alt); border-radius: var(--radius-sm); margin-bottom: 24px; }
  .view-tab {
    flex: 1; padding: 10px; text-align: center; border-radius: 6px;
    font-size: 15px; font-weight: 600; cursor: pointer; border: none;
    background: transparent; color: var(--text-muted); transition: all 0.2s ease;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .view-tab.active { background: var(--surface); color: var(--text-primary); box-shadow: var(--shadow-sm); }

  .toggle-edit {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); cursor: pointer; font-size: 14px;
    color: var(--text-secondary); font-weight: 500; transition: all 0.2s ease;
    font-family: 'Noto Sans KR', sans-serif; margin-top: 16px;
  }
  .toggle-edit:hover { border-color: var(--text-secondary); }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 16px;
    background: oklch(1 0 0 / 0.9); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border);
    display: none; z-index: 10;
  }
  .bottom-nav.visible { display: block; }
  .bottom-nav .nav-btn {
    width: 100%; max-width: 680px; margin: 0 auto; display: block;
    padding: 16px; border-radius: var(--radius); border: none;
    font-size: 17px; font-weight: 700; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; background: var(--accent); color: white;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .bottom-nav .nav-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }

  .no-result { text-align: center; padding: 48px 20px; color: var(--text-muted); }
  .no-result .emoji { font-size: 48px; margin-bottom: 12px; }
  .no-result .msg { font-size: 17px; line-height: 1.6; }

  .loading-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg); display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 1000;
    transition: opacity 0.5s ease;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .loading-spinner {
    width: 40px; height: 40px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--text-primary); color: white; padding: 12px 24px;
    border-radius: 50px; font-size: 15px; font-weight: 600;
    box-shadow: var(--shadow-lg); z-index: 100;
    opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; overflow: hidden; }
  .confetti { position: absolute; opacity: 0; }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── 첫 화면 미니 캘린더 (overview) ── */
  .overview-card {
    background: var(--surface); border-radius: var(--radius);
    padding: 22px 20px 24px; box-shadow: var(--shadow-sm); margin-bottom: 24px;
  }
  .overview-title {
    font-family: 'Outfit', 'Noto Sans KR', sans-serif;
    font-size: 18px; font-weight: 800; color: var(--text-primary);
    margin-bottom: 18px; text-align: center;
  }

  .overview-layout {
    display: flex; gap: 18px; align-items: center;
  }
  .mini-calendar { flex: 1; min-width: 0; }
  .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .mini-header {
    text-align: center; font-size: 10px; font-weight: 700;
    color: var(--text-muted); padding: 4px 0;
  }
  .mini-header.sun { color: var(--sunday); }
  .mini-header.sat { color: var(--accent); }
  .mini-cell {
    aspect-ratio: 1; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 500;
    color: oklch(0.65 0.01 60);
  }
  .mini-cell.empty { visibility: hidden; }
  .mini-cell.sun { color: oklch(0.72 0.12 25); }
  .mini-cell.sat { color: oklch(0.55 0.10 145); font-weight: 700; }
  .mini-cell.target {
    background: var(--accent); color: white; font-weight: 800;
    box-shadow: 0 2px 6px oklch(0.62 0.18 145 / 0.30);
  }

  .donut-stack {
    display: flex; gap: 14px; flex-shrink: 0;
  }
  .big-donut {
    width: 108px; aspect-ratio: 1; position: relative;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .big-donut-ring {
    width: 100%; height: 100%; border-radius: 50%;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px oklch(0.62 0.18 145 / 0.18);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .big-donut-inner {
    position: absolute; inset: 18%;
    background: var(--surface); border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: inset 0 1px 3px oklch(0.22 0.02 60 / 0.06);
  }
  .big-donut-label {
    font-family: 'Outfit', sans-serif;
    font-size: 9px; font-weight: 700; color: var(--text-muted);
    letter-spacing: 0.5px; line-height: 1;
  }
  .big-donut-day {
    font-family: 'Outfit', sans-serif;
    font-size: 26px; font-weight: 800; color: var(--text-primary);
    line-height: 1; margin: 2px 0 4px;
  }
  .big-donut-count {
    font-family: 'Outfit', sans-serif;
    font-size: 11px; font-weight: 800; color: var(--accent-dark);
    padding: 2px 8px; border-radius: 10px;
    background: var(--accent-light);
    letter-spacing: -0.2px;
  }
  .big-donut.full .big-donut-ring {
    box-shadow: 0 6px 22px oklch(0.62 0.18 145 / 0.50);
    animation: pulseGlow 2s ease-in-out infinite;
  }
  .big-donut.full .big-donut-inner { background: var(--accent); }
  .big-donut.full .big-donut-day,
  .big-donut.full .big-donut-label { color: white; }
  .big-donut.full .big-donut-count {
    background: oklch(1 0 0 / 0.25); color: white;
  }
  @keyframes pulseGlow {
    0%,100% { box-shadow: 0 6px 22px oklch(0.62 0.18 145 / 0.50); }
    50% { box-shadow: 0 6px 28px oklch(0.62 0.18 145 / 0.70); }
  }

  .overview-legend {
    display: flex; align-items: center; justify-content: center;
    flex-wrap: wrap; gap: 8px 12px;
    margin-top: 18px; padding-top: 16px;
    border-top: 1px dashed var(--border);
    font-size: 12px; color: var(--text-secondary);
  }
  .legend-item { display: inline-flex; align-items: center; gap: 5px; }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 50%; display: inline-block;
  }

  @media (max-width: 600px) {
    .overview-layout { flex-direction: column; align-items: stretch; gap: 18px; }
    .donut-stack { justify-content: center; }
  }
  @media (max-width: 480px) {
    .person-grid { grid-template-columns: repeat(2, 1fr); }
    .month-block { padding: 16px; }
    .cal-cell { font-size: 15px; }
    .cal-cell.saturday { font-size: 17px; }
    .cal-header { font-size: 12px; }
    .overview-card { padding: 18px 14px 20px; }
    .big-donut { width: 100px; }
    .big-donut-day { font-size: 24px; }
  }
  @media (max-width: 360px) {
    .big-donut { width: 88px; }
    .big-donut-day { font-size: 21px; }
    .big-donut-count { font-size: 10px; }
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <p style="color:var(--text-secondary);font-size:16px;">데이터 불러오는 중...</p>
</div>

<div class="container">
  <div class="header">
    <span class="subtitle-emoji">📅</span>
    <h1>우리 언제 만날까?</h1>
    <p>5월 16일 / 5월 23일 중<br>모두가 되는 날을 정해보자!</p>
  </div>

  <div id="personSection">
    <div class="sync-bar">
      <div class="dot"></div>
      실시간 연동 — 누가 입력하면 자동 반영!
    </div>

    <div class="overview-card">
      <div class="overview-title">📅 5월 한눈에 보기</div>
      <div class="overview-layout">
        <div class="mini-calendar" id="miniCalendar"></div>
        <div class="donut-stack" id="bigDonuts"></div>
      </div>
      <div class="overview-legend" id="overviewLegend"></div>
    </div>

    <p style="font-size:17px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;padding-left:2px;">
      본인 이름을 눌러주세요
    </p>
    <div class="person-grid" id="personGrid"></div>
  </div>

  <div class="calendar-section" id="calendarSection">
    <div class="current-person-bar" id="currentPersonBar"></div>
    <div id="calendarContent"></div>
    <div class="save-bar">
      <button class="save-btn" id="saveBtn" onclick="saveAndGoBack()">✅ 저장하고 돌아가기</button>
    </div>
  </div>

  <div class="results-section" id="resultsSection">
    <div class="view-tabs">
      <button class="view-tab active" onclick="showResultView('best',event)">🏆 추천 날짜</button>
      <button class="view-tab" onclick="showResultView('all',event)">📋 전체 보기</button>
    </div>
    <div id="resultContent"></div>
    <button class="toggle-edit" onclick="goToStep1()">← 다시 돌아가기</button>
  </div>
</div>

<div class="bottom-nav" id="bottomNav">
  <button class="nav-btn" onclick="showResults()">📊 결과 확인하기</button>
</div>

<div class="toast" id="toast"></div>
<div class="confetti-container" id="confettiContainer"></div>

<script>
// Firebase 설정
const firebaseConfig = {
  apiKey: "AIzaSyBaG--INwou5qe8AI1_6nCJrCIJB6JrXfY",
  authDomain: "saturday-scheduler.firebaseapp.com",
  databaseURL: "https://saturday-scheduler-default-rtdb.firebaseio.com",
  projectId: "saturday-scheduler",
  storageBucket: "saturday-scheduler.firebasestorage.app",
  messagingSenderId: "333503845974",
  appId: "1:333503845974:web:ffda2c47f95b3039940df7"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 7명 구별성 강화 팔레트 — hue + 명도 + 채도 모두 차이
const COLORS = [
  'oklch(0.55 0.18 145)',  // 김영기 — 진한 녹색
  'oklch(0.55 0.20 295)',  // 오정수 — 진한 보라 (어둡게)
  'oklch(0.75 0.17 55)',   // 장재호 — 밝은 주황
  'oklch(0.55 0.22 20)',   // 오현길 — 진한 빨강 (어둡게)
  'oklch(0.50 0.16 245)',  // 정정일 — 진한 파랑
  'oklch(0.72 0.20 350)',  // 김승욱 — 밝은 핫핑크
  'oklch(0.68 0.13 200)'   // 이진만 — 청록 (녹색과 hue/명도 모두 차이)
];
const AVATARS = ['😎','🤗','😊','🙂','😄','🤩','😁'];
const people = ['김영기','오정수','장재호','오현길','정정일','김승욱','이진만'];
let selections = {};
people.forEach(n => { selections[n] = new Set(); });

const SATURDAYS = [
  { key:'2026-05-16', m:5, d:16, label:'5월 16일 토요일' },
  { key:'2026-05-23', m:5, d:23, label:'5월 23일 토요일' },
];

let currentPerson = null, currentIndex = -1, currentResultView = 'best';

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function loadData() {
  return new Promise((resolve) => {
    db.ref('selections').once('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        people.forEach(name => {
          if (data[name] && data[name].selected_dates) {
            selections[name] = new Set(data[name].selected_dates);
          }
        });
      }
      resolve();
    });
  });
}

function savePersonData(name) {
  const dates = Array.from(selections[name]);
  return db.ref('selections/' + name).set({
    selected_dates: dates,
    updated_at: new Date().toISOString()
  }).then(() => true).catch((e) => {
    console.error('Save error:', e);
    showToast('⚠️ 저장 실패 — 인터넷 확인해주세요');
    return false;
  });
}

function subscribeRealtime() {
  db.ref('selections').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      let changed = false;
      people.forEach(name => {
        const newDates = (data[name] && data[name].selected_dates) ? data[name].selected_dates : [];
        const newSet = new Set(newDates);
        const oldSet = selections[name];
        if (newSet.size !== oldSet.size || [...newSet].some(d => !oldSet.has(d))) {
          selections[name] = newSet;
          changed = true;
        }
      });
      if (changed && !currentPerson) {
        renderPersonGrid();
        renderOverviewCalendar();
        updateBottomNav();
      }
    }
  });
}

async function init() {
  await loadData();
  subscribeRealtime();
  renderPersonGrid();
  renderOverviewCalendar();
  document.getElementById('overviewLegend').innerHTML = renderFriendLegend();
  updateBottomNav();
  document.getElementById('loadingOverlay').classList.add('hidden');
}

function renderPersonGrid() {
  document.getElementById('personGrid').innerHTML = people.map((name,i) => {
    const count = selections[name] ? selections[name].size : 0;
    const has = count > 0;
    return `<div class="person-btn ${has?'has-data':''}" onclick="selectPerson('${name}',${i})">
      <div class="avatar" style="background:${COLORS[i]}">${AVATARS[i]}</div>
      <div class="name">${name}</div>
      <div class="check-count">${has ? count+'일 선택 ✓' : '아직 미입력'}</div>
    </div>`;
  }).join('');
}

function renderOverviewCalendar() {
  renderMiniCalendar();
  renderBigDonuts();
}

function renderMiniCalendar() {
  const year = 2026, month = 5;
  const firstDay = new Date(year, month-1, 1).getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  const days = ['일','월','화','수','목','금','토'];

  let h = `<div class="mini-grid">`;
  days.forEach((d,i) => {
    h += `<div class="mini-header ${i===0?'sun':''} ${i===6?'sat':''}">${d}</div>`;
  });
  for (let i=0; i<firstDay; i++) h += `<div class="mini-cell empty"></div>`;
  for (let d=1; d<=daysInMonth; d++) {
    const dow = (firstDay+d-1)%7;
    const key = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isTarget = SATURDAYS.some(s => s.key === key);
    let cls = 'mini-cell';
    if (isTarget) cls += ' target';
    else if (dow===6) cls += ' sat';
    else if (dow===0) cls += ' sun';
    h += `<div class="${cls}">${d}</div>`;
  }
  h += `</div>`;
  document.getElementById('miniCalendar').innerHTML = h;
}

function renderBigDonuts() {
  const total = people.length;
  const emptyColor = 'oklch(0.93 0.005 80)';
  let h = '';
  SATURDAYS.forEach(s => {
    let count = 0;
    const segments = people.map((name, i) => {
      const start = (i / total) * 360;
      const end = ((i+1) / total) * 360;
      const selected = selections[name] && selections[name].has(s.key);
      if (selected) count++;
      const color = selected ? COLORS[i] : emptyColor;
      return `${color} ${start}deg ${end}deg`;
    }).join(', ');
    const fullClass = (count === total) ? ' full' : '';
    h += `<div class="big-donut${fullClass}">
      <div class="big-donut-ring" style="background: conic-gradient(${segments})">
        <div class="big-donut-inner">
          <div class="big-donut-label">5월</div>
          <div class="big-donut-day">${s.d}</div>
          <div class="big-donut-count">${count}/${total}</div>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('bigDonuts').innerHTML = h;
}

function renderFriendLegend() {
  return people.map((name, i) =>
    `<span class="legend-item"><span class="legend-dot" style="background:${COLORS[i]}"></span>${name}</span>`
  ).join('');
}

function selectPerson(name, index) {
  currentPerson = name; currentIndex = index;
  document.getElementById('personSection').style.display = 'none';
  document.getElementById('calendarSection').classList.add('visible');
  document.getElementById('resultsSection').classList.remove('visible');
  document.getElementById('bottomNav').classList.remove('visible');
  renderPersonBar(); renderCalendar();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function renderPersonBar() {
  document.getElementById('currentPersonBar').innerHTML = `
    <div class="avatar-sm" style="background:${COLORS[currentIndex]}">${AVATARS[currentIndex]}</div>
    <div class="info">
      <div class="name">${currentPerson}</div>
      <div class="hint">가능한 토요일을 모두 눌러주세요</div>
    </div>
    <button class="back-btn" onclick="saveAndGoBack()">돌아가기</button>`;
}

function renderCalendar() {
  const checked = selections[currentPerson] || new Set();
  const now = new Date();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  function buildMonth(year, month) {
    const firstDay = new Date(year, month-1, 1).getDay();
    const daysInMonth = new Date(year, month, 0).getDate();
    const days = ['일','월','화','수','목','금','토'];
    let h = `<div class="month-block"><div class="month-title">${month}월 ${year}</div><div class="cal-grid">`;
    days.forEach((d,i) => { h += `<div class="cal-header ${i===0?'sun':''} ${i===6?'sat':''}">${d}</div>`; });
    for (let i=0; i<firstDay; i++) h += `<div class="cal-cell empty"></div>`;
    for (let d=1; d<=daysInMonth; d++) {
      const dow = (firstDay+d-1)%7;
      const key = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday = key===todayStr, isSat = dow===6;
      const isValidSat = isSat && SATURDAYS.some(s => s.key === key);
      let cls = 'cal-cell';
      if (isValidSat) cls += ' saturday'; else if (dow===0) cls += ' sun'; else cls += ' weekday';
      if (isValidSat && checked.has(key)) cls += ' checked';
      if (isToday) cls += ' today';
      h += isValidSat
        ? `<div class="${cls}" onclick="toggleDate('${key}',this)">${d}</div>`
        : `<div class="${cls}">${d}</div>`;
    }
    h += `</div></div>`;
    return h;
  }
  document.getElementById('calendarContent').innerHTML = buildMonth(2026,5);
}

function toggleDate(key, el) {
  const set = selections[currentPerson];
  if (set.has(key)) { set.delete(key); el.classList.remove('checked'); }
  else { set.add(key); el.classList.add('checked'); el.style.transform='scale(1.15)'; setTimeout(()=>{el.style.transform='';},250); }
}

async function saveAndGoBack() {
  const btn = document.getElementById('saveBtn');
  btn.textContent = '💾 저장 중...'; btn.disabled = true;
  const ok = await savePersonData(currentPerson);
  btn.textContent = '✅ 저장하고 돌아가기'; btn.disabled = false;
  if (ok) showToast(`${currentPerson}님 저장 완료!`);
  currentPerson = null; currentIndex = -1;
  goToStep1();
}

function goToStep1() {
  document.getElementById('personSection').style.display = 'block';
  document.getElementById('calendarSection').classList.remove('visible');
  document.getElementById('resultsSection').classList.remove('visible');
  renderPersonGrid(); renderOverviewCalendar(); updateBottomNav();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function updateBottomNav() {
  const any = Object.values(selections).some(s => s.size > 0);
  document.getElementById('bottomNav').classList.toggle('visible', any);
}

function showResults() {
  document.getElementById('personSection').style.display = 'none';
  document.getElementById('calendarSection').classList.remove('visible');
  document.getElementById('resultsSection').classList.add('visible');
  document.getElementById('bottomNav').classList.remove('visible');
  renderResults();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function showResultView(view, e) {
  currentResultView = view;
  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  renderResults();
}

function renderResults() {
  const total = people.length;
  const scores = SATURDAYS.map(s => {
    const avail=[], unavail=[];
    people.forEach((name,i) => {
      if (selections[name] && selections[name].has(s.key)) avail.push({name,i});
      else unavail.push({name,i});
    });
    return { ...s, avail, unavail, count: avail.length };
  });
  scores.sort((a,b) => b.count - a.count);
  const max = scores[0] ? scores[0].count : 0;
  let list = scores;
  if (currentResultView==='best') list = scores.filter(d => d.count>0 && d.count>=max-1);
  if (!list.length || max===0) {
    document.getElementById('resultContent').innerHTML = `
      <div class="no-result"><div class="emoji">🤔</div>
      <div class="msg">아직 입력된 데이터가 없어요.<br>각자 이름을 눌러 날짜를 체크해주세요!</div></div>`;
    return;
  }
  document.getElementById('resultContent').innerHTML = list.map((d,idx) => {
    const best = d.count===max && d.count>0;
    const pct = Math.round((d.count/total)*100);
    const chips = d.avail.map(p =>
      `<span class="person-chip available" style="background:${COLORS[p.i]}22;color:${COLORS[p.i]}">${AVATARS[p.i]} ${p.name}</span>`
    ).join('') + d.unavail.map(p =>
      `<span class="person-chip unavailable">${p.name}</span>`
    ).join('');
    return `<div class="result-card ${best?'best':''}" style="animation:fadeIn .4s ${idx*.08}s both ease-out">
      <div class="result-date">${d.label}</div>
      <div class="result-people">${chips}</div>
      <div class="result-bar-track">
        <div class="result-bar-fill" style="width:${pct}%;background:${best?'var(--accent)':'var(--text-muted)'}"></div>
      </div>
      <div class="result-count">${d.count}명 / ${total}명 가능 (${pct}%)</div>
    </div>`;
  }).join('');
  if (max===total) launchConfetti();
}

function launchConfetti() {
  const c = document.getElementById('confettiContainer'); c.innerHTML='';
  const cols = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff8fd8','#845ef7'];
  for (let i=0;i<60;i++) {
    const el = document.createElement('div'); el.className='confetti';
    el.style.left=Math.random()*100+'%';
    el.style.background=cols[Math.floor(Math.random()*cols.length)];
    el.style.width=(Math.random()*8+6)+'px';el.style.height=(Math.random()*8+6)+'px';
    el.style.borderRadius=Math.random()>.5?'50%':'2px';
    el.style.animation=`confettiFall ${Math.random()*2+1.5}s ${Math.random()*.8}s ease-out forwards`;
    c.appendChild(el);
  }
  setTimeout(()=>{c.innerHTML='';},4000);
}

init();
</script>
</body>
</html>
